name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify files exist
        run: |
          echo "📂 Contenido de html/:"
          ls -R html/
          echo "🎨 Contenido de css/:"
          ls -R css/

      - name: Prepare deployment folder
        run: |
          # Crear carpeta public (vacía si ya existe)
          rm -rf public
          mkdir public

          # Copiar HTML (preservando nombres)
          echo "📦 Copiando HTML..."
          cp -v html/*.html public/ || { echo "❌ Error al copiar HTML"; exit 1; }

          # Copiar CSS (en subcarpeta css/)
          echo "🎨 Copiando CSS..."
          mkdir -p public/css
          cp -v css/*.css public/css/ || { echo "❌ Error al copiar CSS"; exit 1; }

          # Verificar estructura final
          echo "✅ Estructura final de public/:"
          ls -R public
          [ -z "$(ls -A public)" ] && { echo "❌ public/ está vacío"; exit 1; }

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v3
