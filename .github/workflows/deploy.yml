name: Deploy Static Site to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - Mostrar estructura del proyecto
        run: |
          echo "📂 Estructura actual:"
          ls -R
          echo "🔍 Archivos HTML:"
          find html -type f -name "*.html"
          echo "🎨 Archivos CSS:"
          find css -type f -name "*.css" || echo "⚠️ ¿La carpeta se llama 'CSS' en lugar de 'css'?"

      - name: Preparar archivos para despliegue
        run: |
          # Crear carpeta public
          mkdir -p public
          
          # Copiar HTML (con verificación)
          echo "📦 Copiando archivos HTML..."
          if ! cp -v html/*.html public/; then
            echo "❌ Error: No se pudieron copiar los archivos HTML"
            exit 1
          fi
          
          # Copiar CSS (versión a prueba de errores)
          echo "🎨 Copiando archivos CSS..."
          mkdir -p public/css
          if ! cp -v css/*.css public/css/ 2>/dev/null; then
            # Intento alternativo por si la carpeta se llama CSS
            if ! cp -v CSS/*.css public/css/ 2>/dev/null; then
              echo "❌ Error: No se encontró la carpeta CSS/css"
              echo "ℹ️ Asegúrate que la carpeta existe y contiene archivos .css"
              exit 1
            fi
          fi
          
          echo "✅ Contenido final de public/:"
          ls -R public

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Desplegar
        uses: actions/deploy-pages@v3
