name: Deploy to GitHub Pages

on:
  push:
    branches: [main]  # Cambia a "master" si es tu rama principal

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify files
        run: |
          echo "Estructura del proyecto:"
          ls -R html css  # Verifica que los archivos existen

      - name: Prepare deployment
        run: |
          mkdir -p public
          cp -r html/* public/ || { echo "❌ Error al copiar HTML"; exit 1; }
          cp -r css public/ || { echo "❌ Error al copiar CSS"; exit 1; }
          echo "✅ Contenido de public/:"
          ls -R public  # Debug

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v3
